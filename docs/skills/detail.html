<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Details</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/skill-detail.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="breadcrumb">
                <a href="../index.html">&larr; Back to Dashboard</a>
            </div>
            <div class="skill-header">
                <h1 id="skillName">Loading...</h1>
                <div class="skill-score">
                    <div class="score-value" id="totalScore">--</div>
                    <div class="score-label">/100</div>
                </div>
            </div>
            <p id="skillDescription" class="skill-description" style="display: none;"></p>
            <div id="statusLine" class="status-line"></div>
        </div>
    </header>

    <main class="container">
        <div class="layers-stack">
            <div class="category-card" id="safetyCard">
                <p class="loading">Loading...</p>
            </div>
            <div class="category-card" id="staticCard">
                <p class="loading">Loading...</p>
            </div>
            <div class="category-card" id="evalCard">
                <p class="loading">Loading...</p>
            </div>
            <div class="category-card" id="apiCard">
                <p class="loading">Loading...</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>
                <a href="../index.html">Dashboard</a> |
                <a href="https://github.com/m0j0d/skills">View on GitHub</a>
            </p>
        </div>
    </footer>

    <script src="../js/scoring.js"></script>
    <script src="../js/skill-detail.js"></script>
</body>
</html>
